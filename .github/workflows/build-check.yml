name: Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build shared-types
        working-directory: .
        run: npm run build -w shared-types

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  build-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npx expo export --platform all

  # Synthesizes the staging stacks and runs their tests. Needs no AWS credentials:
  # the account is in infra/cdk.json and lookups are cached in cdk.context.json.
  build-infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        working-directory: .
        run: npm ci -w infra

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Synth
        run: npx cdk synth --quiet
