name: Lint and Test

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build shared-types
        working-directory: .
        run: npm run build -w shared-types

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  e2e-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18.6-alpine # keep in sync with apps/api/docker-compose.yml
        env:
          POSTGRES_USER: yuji
          POSTGRES_PASSWORD: yuji
          POSTGRES_DB: yuji
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuji -d yuji"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yuji:yuji@localhost:5432/yuji?schema=public
      # follows.e2e-spec.ts only runs when this is set; the CI database is throwaway
      FOLLOW_TEST_DATABASE_URL: postgresql://yuji:yuji@localhost:5432/yuji?schema=public
      # search.e2e-spec.ts only runs when this is set; it migrates into its own throwaway schema
      SEARCH_TEST_DATABASE_URL: postgresql://yuji:yuji@localhost:5432/yuji?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build shared-types
        working-directory: .
        run: npm run build -w shared-types

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: E2E tests
        run: npm run test:e2e

  lint-and-test-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: UI tests
        run: npm run test:ui
