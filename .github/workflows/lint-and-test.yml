name: Lint and Test

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install shared-types
        working-directory: apps/shared-types
        run: npm ci

      - name: Build shared-types
        working-directory: apps/shared-types
        run: npm run build

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  lint-and-test-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild

      - name: Lint
        run: npm run lint

      # Typecheck disabled temporarily due to React 19 compatibility issues from main
      # - name: Typecheck
      #   run: npm run typecheck
