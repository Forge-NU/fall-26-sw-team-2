# Local Postgres for development (host port 5433, so it does not clash with a
# Postgres already installed on 5432). Credentials here are for local use only.
# Start: docker compose up -d   Stop: docker compose down   Wipe data: docker compose down -v
services:
  db:
    image: postgres:18.6-alpine # keep in sync with the RDS engine version
    restart: unless-stopped
    environment:
      POSTGRES_USER: pinly
      POSTGRES_PASSWORD: pinly
      POSTGRES_DB: pinly
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pinly -d pinly']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
